
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Dashboard Comercial Offline</title>

<style>
body{background:#071633;color:white;font-family:Arial;padding:20px}
h1{font-size:38px}
.upload,.card,.chart{background:#10224a;border-radius:18px;padding:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin:25px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.full{grid-column:span 2}
.filters{display:flex;gap:15px;margin-top:15px;flex-wrap:wrap}
select{padding:12px;border:none;border-radius:10px;background:#18356d;color:white;min-width:300px}
input[type="date"]{
padding:12px;
border:none;
border-radius:10px;
background:#18356d;
color:white;
min-width:180px;
}
input[type="date"]::-webkit-calendar-picker-indicator{
filter:invert(1);
cursor:pointer;
}
.row{
    display:grid;
    grid-template-columns:420px 1fr;
    gap:12px;
    align-items:center;
    margin-bottom:18px;
}
.bar-bg{background:#18356d;height:28px;border-radius:10px;overflow:hidden}
.bar{height:100%;background:#4f8cff;border-radius:10px}
.uf{display:inline-block;background:#18356d;padding:14px;border-radius:12px;margin:8px;min-width:100px;text-align:center;cursor:pointer}
.uf:hover{background:#2563eb}
</style>
</head>
<body>

<div style="display:flex;align-items:center;gap:15px;">

<img src="logo.png"
style="
height:70px;
border-radius:12px;
">

<div>

<h1>Dashboard - Vendas</h1>


</div>

</div>

<div class="upload">

<input type="file" id="csvFile" accept=".csv">

<div class="filters">

<select id="ufFiltro">
<option value="">Todas UF</option>
</select>

<select id="clienteFiltro">
<option value="">Todos os Clientes</option>
</select>

<select id="repFiltro">
<option value="">Todos os Representantes</option>
</select>

<select id="anoFiltro">
<option value="">Todos os Anos</option>
</select>

<input type="date" id="dataInicial">

<input type="date" id="dataFinal">

</div>

</div>



<div class="cards">
<div class="card"><h3>Faturamento Total</h3><h1 id="fat">R$ 0</h1></div>
<div class="card"><h3>Clientes Ativos</h3><h1 id="cli">0</h1></div>
<div class="card"><h3>Quantidade de Produtos Vendidos</h3><h1 id="qtd">0</h1></div>
</div>

<div class="grid">

<div class="chart">
<h2>🏆 Top Clientes</h2>
<div id="clientes"></div>
</div>

<div class="chart">
<h2>🔥 Top 10 Produtos</h2>
<div id="grupo"></div>
</div>

<div class="chart full">
<h2>🗺️ Participação por UF</h2>
<div id="ufs"></div>
</div>

<div class="chart full">
<div style="
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
">

<h2>🔥 Produtos Vendidos</h2>

<div id="totalMetros"
style="
font-size:18px;
font-weight:600;
color:#fff;
margin:15px 0;
text-align:center;
">
0 m
</div>

<input
type="text"
id="produtoBusca"
placeholder="🔎 Buscar produto..."
style="
padding:10px;
border:none;
border-radius:10px;
background:#1d3b7a;
color:white;
width:280px;
">

</div>

<div id="produtos"></div>
</div>

</div>

<script>

let dados = [];
let filtrados = [];

let produtoSelecionado = '';
let produtoDetalheHTML = '';

document.getElementById('csvFile').addEventListener('change', carregar);

document.getElementById('ufFiltro')
.addEventListener('change', ()=>{
popularClientes();
aplicarFiltros();
});

document.getElementById('clienteFiltro')
.addEventListener('change', aplicarFiltros);

document.getElementById('repFiltro')
.addEventListener('change', ()=>{

popularClientes();
aplicarFiltros();

});

document.getElementById('repFiltro')
.addEventListener('change', aplicarFiltros);

document.getElementById('dataInicial')
.addEventListener('change', aplicarFiltros);

document.getElementById('dataFinal')
.addEventListener('change', aplicarFiltros);


document.getElementById('produtoBusca')
.addEventListener('input', aplicarFiltros);

document.getElementById('anoFiltro')
.addEventListener('change', aplicarFiltros);

function carregar(e){

const file=e.target.files[0];

const reader=new FileReader();

reader.onload=function(evt){

dados=parseCSV(evt.target.result);

popularUF();
popularClientes();
popularRepresentantes();
popularAnos();

aplicarFiltros();

};

reader.readAsText(file,'utf-8');

}

function parseCSV(texto){

const linhas=texto.split(/\r?\n/).filter(x=>x.trim());

const idx=linhas.findIndex(l=>l.includes('Razão social'));

const headers=linhas[idx].split(';').map(h=>h.trim());

return linhas.slice(idx+1).map(l=>{

const cols=l.split(';');


let o={};

headers.forEach((h,i)=>{
o[h]=(cols[i]||'').trim();
});

return o;

}).filter(x=>x['Razão social']);

}

function numero(v){

return Number(
String(v||'0')
.replace(/\./g,'')
.replace(',','.')
.replace(/[^\d.-]/g,'')
)||0;

}

function moeda(v){

return new Intl.NumberFormat('pt-BR',{
style:'currency',
currency:'BRL'
}).format(v||0);

}

function popularUF(){

const uf=document.getElementById('ufFiltro');

uf.innerHTML='<option value="">Todas UF</option>';

[...new Set(dados.map(x=>x['UF']).filter(Boolean))]
.sort()
.forEach(u=>{

uf.innerHTML += `<option value="${u}">${u}</option>`;

});

}

function popularClientes(){

const cliente =
document.getElementById('clienteFiltro');

cliente.innerHTML =
'<option value="">Todos os Clientes</option>';

const uf =
document.getElementById('ufFiltro').value;

const rep =
document.getElementById('repFiltro').value;

let base = dados;

if(uf){

base = base.filter(x => x['UF'] === uf);

}

if(rep){

base = base.filter(
x => x['Abreviação'] === rep
);

}

[...new Set(
base.map(x => x['Razão social'])
.filter(Boolean)
)]
.sort()
.forEach(c=>{

cliente.innerHTML +=
`<option value="${c}">${c}</option>`;

});

}

function popularRepresentantes(){

const select =
document.getElementById('repFiltro');

select.innerHTML =
'<option value="">Todos os Representantes</option>';

const reps = [
...new Set(
dados.map(x => x['Abreviação'])
.filter(Boolean)
)
].sort();

reps.forEach(r=>{

select.innerHTML +=
`<option value="${r}">${r}</option>`;

});

}

function popularRepresentantesFiltrados(lista){

const select =
document.getElementById('repFiltro');

const atual = select.value;

const reps = [
...new Set(
lista.map(x => x['Abreviação'])
.filter(Boolean)
)
].sort();

select.innerHTML =
'<option value="">Todos os Representantes</option>';

reps.forEach(r=>{

select.innerHTML +=
`<option value="${r}">${r}</option>`;

});

if(reps.includes(atual)){
select.value = atual;
}

}

function popularClientesFiltrados(lista){

const select =
document.getElementById('clienteFiltro');

const atual = select.value;

const clientes = [
...new Set(
lista.map(x => x['Razão social'])
.filter(Boolean)
)
].sort();

select.innerHTML =
'<option value="">Todos os Clientes</option>';

clientes.forEach(c=>{

select.innerHTML +=
`<option value="${c}">${c}</option>`;

});

if(clientes.includes(atual)){
select.value = atual;
}

}

function popularAnos(){

const select =
document.getElementById('anoFiltro');

select.innerHTML =
'<option value="">Todos os Anos</option>';

const anos = [...new Set(

dados.map(x=>{

const data = x['Dt.faturam'];

if(!data) return null;

return data.split('/')[2];

})

.filter(Boolean)

)].sort();

anos.forEach(a=>{

select.innerHTML +=
`<option value="${a}">${a}</option>`;

});

}

function aplicarFiltros(){

const uf=document.getElementById('ufFiltro').value;
const cliente=document.getElementById('clienteFiltro').value;
const rep=document.getElementById('repFiltro').value;
const ano=document.getElementById('anoFiltro').value;

const dataInicial =
document.getElementById('dataInicial').value;

const dataFinal =
document.getElementById('dataFinal').value;

const buscaProduto =
document.getElementById('produtoBusca')
.value
.toLowerCase();

filtrados=dados.filter(x=>{

const okUF=!uf || x['UF']===uf;
const okCliente=!cliente || x['Razão social']===cliente;
const okRep =
!rep || x['Abreviação']===rep;

const dataFat = x['Dt.faturam'];

let okAno = true;

if(ano && dataFat){

okAno =
dataFat.split('/')[2] === ano;

}

let okData = true;

if(dataFat){

    const [dia, mes, anoLinha] =
    dataFat.split('/');

    const dataLinha =
    `${anoLinha}-${mes}-${dia}`;

    if(dataInicial){

        okData =
        okData &&
        dataLinha >= dataInicial;

    }

    if(dataFinal){

        okData =
        okData &&
        dataLinha <= dataFinal;

    }

}

const produto =
(x['Desc.completa'] || '')
.toLowerCase();

const okProduto =
!buscaProduto ||
produto.includes(buscaProduto);

return okUF &&
okCliente &&
okRep &&
okAno &&
okProduto &&
okData;

});

popularClientesFiltrados(filtrados);

popularRepresentantesFiltrados(filtrados);

render();

}

const produtosExcluidos = [
'27',
'47',
'51',
'205',
'214',
'218',
'259',
'261',
'348',
'383',
'4251',
'4553',
'7109',
'8938',
'8939',
'10021',
'11056',
'11477',
'11772',
'11860',
'12331',
'12691',
'12696',
'13029',
'13069',
'13166',
'13168',
'13199',
'13327',
'13534',
'16405',
'16423',
'16526',
'16528',
'16612',
'16682',
'16827',
'16830',
'17117',
'17132',
'17134',
'17166',
'17169',
'17171',
'17173',
'17175'
];

function agrupar(campo){

let o={};

filtrados.forEach(x=>{

    if (
        campo === 'Desc.completa' &&
        produtosExcluidos.includes(
            String(x['Produto']).trim()
        )
    ){
        return;
    }

    const k = x[campo] || 'Não informado';

    const valor = numero(
        x['Valor Fat+Valor IPI+Valor Frete']
    );

    const qtd = numero(
        x['Qtd.item/Ft']
    );

if(!o[k]){

o[k]={
valor:0,
qtd:0,
codigo:x['Produto']
};

}

o[k].valor += valor;
o[k].qtd += qtd;
});

return o;

}

function render(){

console.log(
'UFs filtradas:',
[...new Set(
filtrados.map(x => x['UF'])
)]
);

console.log(
'Registros filtrados:',
filtrados.length
);

const fat=filtrados.reduce((a,b)=>
a+numero(b['Valor Fat+Valor IPI+Valor Frete']),0);

const metrosVendidos = filtrados.reduce((a,b)=>
a + numero(b['Qtd.item/Ft'])
,0);

console.log(
'Faturamento:',
fat
);

const qtd = filtrados.length;

const cli=new Set(
filtrados.map(x=>x['Razão social'])
).size;

document.getElementById('fat').innerText=moeda(fat);
document.getElementById('cli').innerText=cli;
document.getElementById('qtd').innerText=qtd.toLocaleString('pt-BR');

document.getElementById('totalMetros').innerText =
'📏 ' +
metrosVendidos.toLocaleString('pt-BR',{
minimumFractionDigits:2,
maximumFractionDigits:2
}) +
' Total de Metros';

barras('clientes',agrupar('Razão social'),10);
barras('grupo',agrupar('Desc.completa'),10);
barras('produtos',agrupar('Desc.completa'),9999);

ufs();

}

function barras(id,obj,lim){

const el=document.getElementById(id);

const produtos =
id === 'produtos' ||
id === 'grupo';

const top10 = id === 'grupo';

const itens=Object.entries(obj)
.sort((a,b)=>
produtos
? b[1].qtd-a[1].qtd
: b[1].valor-a[1].valor
)
.slice(0,lim);

const max=itens[0]
? (produtos ? itens[0][1].qtd : itens[0][1].valor)
:1;

let html='';

itens.forEach(i=>{

const base = produtos ? i[1].qtd : i[1].valor;

const pct=(base/max)*100;

html += `
<div class="${id === 'clientes' ? 'cliente-row' : 'row'}">

<div>

<div
${produtos ? `onclick="detalharProduto('${i[0].replace(/'/g,"\\'")}')"` : ''}
style="
font-weight:600;
font-size:15px;
display:grid;
grid-template-columns: 400px 170px 220px 120px;
column-gap:20px;
align-items:center;
margin-bottom:14px;
cursor:${produtos ? 'pointer' : 'default'};
"
>
${id === 'clientes' ? `

<div style="
width:330px;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
">
${i[1].codigo} • ${i[0]}
</div>

<div style="
width:170px;
text-align:left;
font-size:15px;
font-weight:600;
">
📏 ${i[1].qtd.toLocaleString('pt-BR')} m
</div>

<div style="
width:220px;
text-align:left;
font-size:15px;
font-weight:600;
">
💰 ${moeda(i[1].valor)}
</div>

<div style="
width:120px;
text-align:left;
font-size:15px;
font-weight:600;
">
🏷️ ${moeda(i[1].qtd ? i[1].valor / i[1].qtd : 0)}
</div>

` : `

<span>
${i[1].codigo} • ${i[0]}
</span>

`}

</div>

</div>

<div>

${top10 ? '' : `
${id !== 'clientes' ? `
<div class="bar-bg">
<div class="bar" style="width:${pct}%"></div>
</div>
` : ''}

`}

${produtos ? `
<div style="
display:flex;
justify-content:flex-end;
gap:12px;
margin-top:${top10 ? '4px' : '8px'};
font-size:${top10 ? '10px' : '13px'};
font-weight:600;
flex-wrap:nowrap;
align-items:center;
">

<div style="text-align:center">
<div style="
font-size:8px;
color:#8fb3ff;
margin-bottom:4px;
letter-spacing:1px;
">
METROS
</div>

<span style="
background:#16356d;
padding:9px 8px;
border-radius:20px;
color:#dbe7ff;
display:inline-block;
min-width:${top10 ? '65px' : '110px'};
">
📏 ${i[1].qtd.toLocaleString('pt-BR')} m
</span>
</div>

<div style="text-align:center">
<div style="
font-size:10px;
color:#8fb3ff;
margin-bottom:4px;
letter-spacing:1px;
">
FATURAMENTO
</div>

<span style="
background:#2563eb;
padding:5px 12px;
border-radius:20px;
color:white;
display:inline-block;
min-width:${top10 ? '95px' : '140px'};
box-shadow:0 0 10px rgba(37,99,235,.35);
">
💰 ${moeda(i[1].valor)}
</span>
</div>

<div style="text-align:center">
<div style="
font-size:10px;
color:#8fb3ff;
margin-bottom:4px;
letter-spacing:1px;
">
PREÇO MÉDIO
</div>

<span style="
background:#0f766e;
padding:5px 12px;
border-radius:20px;
color:white;
display:inline-block;
min-width:${top10 ? '65px' : '110px'};
box-shadow:0 0 10px rgba(15,118,110,.35);
">
🏷️ ${moeda(i[1].qtd ? i[1].valor / i[1].qtd : 0)}
</span>
</div>

</div>
` : ''}

</div>

</div>
`;

if(produtos && produtoSelecionado === i[0]){

const vendasProduto =
filtrados.filter(
x => x['Desc.completa'] === i[0]
);

let clientes = {};

vendasProduto.forEach(x=>{

const cli = x['Razão social'];

if(!clientes[cli]){

clientes[cli] = {
metros:0,
valor:0
};

}

clientes[cli].metros +=
numero(x['Qtd.item/Ft']);

clientes[cli].valor +=
numero(x['Valor Fat+Valor IPI+Valor Frete']);

});

html += `
<div style="
background:#10295e;
padding:20px;
margin:10px 0 25px 0;
border-radius:12px;
">

<h3>📦 ${i[0]}</h3>

<table style="
width:100%;
color:white;
">

<tr>
<th align="left">Cliente</th>
<th align="right">Metros</th>
<th align="right">Faturamento</th>
</tr>
`;

Object.entries(clientes)
.sort((a,b)=>b[1].valor-a[1].valor)
.forEach(([cliente,d])=>{

html += `
<tr>
<td>${cliente}</td>
<td align="right">
${d.metros.toLocaleString('pt-BR')} m
</td>
<td align="right">
${moeda(d.valor)}
</td>
</tr>
`;

});

html += `
</table>
</div>
`;

}


});

el.innerHTML=html;

}

function detalharProduto(produto){

if(produtoSelecionado === produto){

produtoSelecionado = '';
produtoDetalheHTML = '';

render();

return;

}

produtoSelecionado = produto;

const vendas = filtrados.filter(
x => x['Desc.completa'] === produto
);

let clientes = {};

vendas.forEach(x=>{

const cli = x['Razão social'];

if(!clientes[cli]){

clientes[cli] = {
metros:0,
valor:0
};

}

clientes[cli].metros +=
numero(x['Qtd.item/Ft']);

clientes[cli].valor +=
numero(x['Valor Fat+Valor IPI+Valor Frete']);

});

let html = `
<div style="
margin:20px 0;
padding:20px;
background:#10295e;
border-radius:12px;
">

<h3 style="
margin-bottom:15px;
color:white;
">
📦 ${produto}
</h3>

<table style="
width:100%;
border-collapse:collapse;
color:white;
">
<tr>
<th align="left">Cliente</th>
<th align="right">Metros</th>
<th align="right">Faturamento</th>
</tr>
`;

Object.entries(clientes)
.sort((a,b)=>
b[1].valor - a[1].valor
)
.forEach(([cliente,dados])=>{

html += `
<tr>
<td>${cliente}</td>

<td align="right">
${dados.metros.toLocaleString('pt-BR')} m
</td>

<td align="right">
${moeda(dados.valor)}
</td>

</tr>
`;

});

html += `
</table>
</div>
`;

produtoDetalheHTML = html;

render();

}

function ufs(){

const el=document.getElementById('ufs');

const obj=agrupar('UF');

let html='';

Object.entries(obj)
.sort((a,b)=>b[1].valor-a[1].valor)
.forEach(i=>{

html += `
<div class="uf">
<strong>${i[0]}</strong>
<br><br>
${moeda(i[1].valor)}
</div>
`;

});

el.innerHTML=html;

}

</script>

</body>
</html>
